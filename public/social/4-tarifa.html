<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><title>WaterSense · tarifa</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  body{background:#04150f;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{width:1200px;height:675px;position:relative;overflow:hidden;color:#fff;padding:54px 60px;
    background:radial-gradient(120% 130% at 82% -10%,#1a5236 0%,#0c3322 42%,#06241a 72%,#04160f 100%);display:flex;flex-direction:column}
  .num{font-variant-numeric:tabular-nums}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .logo{width:34px;height:34px;border-radius:9px;background:rgba(88,208,139,.16);border:1px solid rgba(88,208,139,.4);display:flex;align-items:center;justify-content:center}
  .brand{font-size:24px;font-weight:700;letter-spacing:-.3px}
  h1{font-size:54px;line-height:1.04;font-weight:800;letter-spacing:-1.5px}
  .accent{color:#74E0AC}
  .sub{font-size:20px;color:rgba(255,255,255,.62);margin-top:16px;line-height:1.5;max-width:800px}
  .panel{margin-top:auto;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:26px 30px}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .pill{font-size:15px;font-weight:700;border-radius:999px;padding:7px 15px;background:rgba(88,208,139,.18);border:1px solid rgba(88,208,139,.4);color:#74E0AC}
  .save{font-size:16px;color:rgba(255,255,255,.7)}
  .save b{color:#5BE08A}
  .bars{display:flex;align-items:flex-end;gap:4px;height:150px}
  .bar{flex:1;border-radius:4px 4px 0 0;min-height:6px}
  .axis{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:rgba(255,255,255,.45)}
</style></head>
<body><div class="card">
  <div class="top">
    <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 5 9.5 5 14.5a7 7 0 0 0 14 0C19 9.5 12 2 12 2Z" fill="#74E0AC"/></svg></span>
    <span class="brand">WaterSense</span>
  </div>
  <h1>Riega cuando la <span class="accent">luz cuesta menos.</span></h1>
  <p class="sub">Precio de la luz por hora (CENACE). Programamos tu bombeo en la ventana barata, sin que muevas un dedo.</p>

  <div class="panel">
    <div class="head">
      <span class="pill">Mejor ventana: 1–5 AM</span>
      <span class="save num">Ahorro estimado <b>−$2,400 / mes</b></span>
    </div>
    <div class="bars" id="bars"></div>
    <div class="axis"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>11 PM</span></div>
  </div>
</div>
<script>
  // Curva PML tipo CENACE: barata de madrugada, pico al anochecer.
  const bars = document.getElementById('bars');
  for (let h = 0; h < 24; h++) {
    const base = 1.8 + Math.sin(((h - 15) / 24) * 6.28) * 0.9 + (h >= 18 && h <= 22 ? 0.9 : 0) - (h >= 1 && h <= 5 ? 0.6 : 0);
    const v = Math.max(0.6, base);
    const cheap = h >= 1 && h <= 5;
    const peak = h >= 18 && h <= 22;
    const d = document.createElement('div');
    d.className = 'bar';
    d.style.height = (v / 3.6 * 100) + '%';
    d.style.background = cheap ? '#5BE08A' : peak ? '#FF8A6B' : 'rgba(255,255,255,.22)';
    bars.appendChild(d);
  }
</script>
</body></html>
