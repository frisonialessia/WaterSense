<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><title>WaterSense · futuro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  body{background:#04150f;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{width:1200px;height:675px;position:relative;overflow:hidden;color:#fff;padding:54px 60px;
    background:radial-gradient(120% 130% at 82% -10%,#1a5236 0%,#0c3322 42%,#06241a 72%,#04160f 100%);display:flex;flex-direction:column}
  .num{font-variant-numeric:tabular-nums}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .logo{width:34px;height:34px;border-radius:9px;background:rgba(88,208,139,.16);border:1px solid rgba(88,208,139,.4);display:flex;align-items:center;justify-content:center}
  .brand{font-size:24px;font-weight:700;letter-spacing:-.3px}
  h1{font-size:54px;line-height:1.04;font-weight:800;letter-spacing:-1.5px}
  .accent{color:#FF8A6B}
  .sub{font-size:20px;color:rgba(255,255,255,.62);margin-top:16px;line-height:1.5;max-width:780px}
  .panel{margin-top:auto;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:26px 30px;display:flex;gap:30px;align-items:center}
  .legend{display:flex;gap:18px;margin-bottom:8px;font-size:15px;color:rgba(255,255,255,.7)}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:middle}
  .side{margin-left:auto;text-align:right;flex-shrink:0}
  .label{font-size:13px;letter-spacing:1.4px;color:rgba(255,255,255,.55);font-weight:700}
  .year{font-size:78px;font-weight:800;color:#FF8A6B;line-height:1;margin:6px 0}
  .gain{display:inline-block;margin-top:10px;font-size:16px;font-weight:700;background:rgba(88,208,139,.18);border:1px solid rgba(88,208,139,.4);color:#74E0AC;border-radius:999px;padding:7px 14px}
</style></head>
<body><div class="card">
  <div class="top">
    <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 5 9.5 5 14.5a7 7 0 0 0 14 0C19 9.5 12 2 12 2Z" fill="#74E0AC"/></svg></span>
    <span class="brand">WaterSense</span>
  </div>
  <h1>¿En qué año <span class="accent">se queda sin agua</span><br/>tu pozo?</h1>
  <p class="sub">Mueve las palancas de extracción y reúso, y la proyección del acuífero te dice cuántos años ganas.</p>

  <div class="panel">
    <div style="flex:1">
      <div class="legend">
        <span><span class="dot" style="background:#FF8A6B"></span>No hacer nada</span>
        <span><span class="dot" style="background:#5BE08A"></span>Plan regenerativo</span>
        <span><span class="dot" style="background:rgba(255,255,255,.5)"></span>Nivel crítico</span>
      </div>
      <svg viewBox="0 0 620 220" width="100%" height="220">
        <line x1="50" y1="181" x2="600" y2="181" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-dasharray="6 6"/>
        <text x="54" y="174" fill="rgba(255,255,255,.5)" font-size="12">nivel crítico (140 m)</text>
        <polyline points="50,64 122,90 194,128 266,181 374,196 590,200" fill="none" stroke="#FF8A6B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        <polyline points="50,64 230,83 410,102 590,121" fill="none" stroke="#5BE08A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="266" y1="30" x2="266" y2="200" stroke="rgba(255,138,107,.5)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <circle cx="266" cy="181" r="5" fill="#FF8A6B"/>
        <text x="50" y="215" fill="rgba(255,255,255,.5)" font-size="12">2026</text>
        <text x="566" y="215" fill="rgba(255,255,255,.5)" font-size="12">2056</text>
      </svg>
    </div>
    <div class="side">
      <div class="label">SIN ACTUAR, SE AGOTA EN</div>
      <div class="year num">2038</div>
      <span class="gain num">+12 años con el plan</span>
    </div>
  </div>
</div></body></html>
